<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#560604"/>
      <stop offset="100%" stop-color="#2d0302"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background Shield with Soft Shadow & Border -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#800a07" stroke-width="8"/>

  <!-- Inner Gold/White Ring -->
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="4" opacity="0.3"/>

  <!-- Scales of Justice Symbol (Waage der Gerechtigkeit) -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Pillar & Top Finial -->
    <path d="M 256 90 L 256 390"/>
    <path d="M 256 80 L 256 100"/>
    
    <!-- Pedestal Base -->
    <path d="M 176 390 L 336 390"/>
    <path d="M 206 415 L 306 415"/>

    <!-- Main Crossbar -->
    <path d="M 116 160 L 396 160"/>
    <circle cx="256" cy="160" r="14" fill="#ffffff"/>

    <!-- Left Scale Pan -->
    <path d="M 116 160 L 76 270"/>
    <path d="M 116 160 L 156 270"/>
    <path d="M 60 270 Q 116 310 172 270 Z" fill="url(#goldGrad)" fill-opacity="0.2"/>

    <!-- Right Scale Pan -->
    <path d="M 396 160 L 356 270"/>
    <path d="M 396 160 L 436 270"/>
    <path d="M 340 270 Q 396 310 452 270 Z" fill="url(#goldGrad)" fill-opacity="0.2"/>
  </g>
</svg>
